name: Publish tiles and firing times

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *"   # hourly: firing times, warnings, rain fallback
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p site
          cp -r tiles site/
          cp README.md site/ 2>/dev/null || true
          python3 tools/firing_times.py site/firing.json || echo '{"error":"firing times unavailable"}' > site/firing.json
          cat site/firing.json | head -c 600; echo
          python3 tools/weather.py site || true
          python3 tools/routes.py routes site/routes.json || echo '{"routes":[]}' > site/routes.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy runs as its own job (GitHub's recommended layout). Deploying in the
  # same job straight after the upload sometimes hits a race where the
  # artifact API still reports 0 artifacts ("No artifacts named github-pages").
  # A separate job gives the artifact time to register; one retry covers the
  # rare case where it still isn't visible.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
